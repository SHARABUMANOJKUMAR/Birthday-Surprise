<svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Romantic Color Shifting Gradient -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844">
        <animate attributeName="stop-color" values="#ff0844;#ffb199;#ff4d6d;#ff0844" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ffb199">
        <animate attributeName="stop-color" values="#ffb199;#ff0844;#ffb199" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <!-- Deep Space/Dark Romantic Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b1c">
        <animate attributeName="stop-color" values="#1a0b1c;#2a0815;#1a0b1c" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b1525">
        <animate attributeName="stop-color" values="#3b1525;#1a0b1c;#3b1525" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- 3D Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow for 3D depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .title { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      font-size: 46px; 
      font-weight: 900; 
      fill: url(#grad1); 
      filter: url(#glow); 
      letter-spacing: 1px;
    }
    .subtitle { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      font-size: 19px; 
      font-weight: 400; 
      fill: #ffccd5; 
      letter-spacing: 3px; 
      filter: url(#shadow); 
    }
    
    .heart { fill: #ff4d6d; opacity: 0; filter: url(#glow); transform-origin: center; }
    
    /* CSS Animations for Floating Hearts */
    @keyframes floatUp {
      0% { transform: translateY(50px) scale(0.3); opacity: 0; }
      30% { opacity: 0.9; }
      100% { transform: translateY(-120px) scale(1.3); opacity: 0; }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    .h1 { animation: floatUp 6s ease-in-out infinite; }
    .h2 { animation: floatUp 8s ease-in-out infinite 2s; }
    .h3 { animation: floatUp 7s ease-in-out infinite 4s; }
    .h4 { animation: floatUp 9s ease-in-out infinite 1s; }
    .h5 { animation: floatUp 6.5s ease-in-out infinite 3s; }
    
    .text-container { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Background -->
  <rect width="800" height="250" rx="24" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle animated blobs for auto-changing UI feel -->
  <circle cx="150" cy="50" r="100" fill="#ff0844" opacity="0.2" filter="url(#glow)">
    <animate attributeName="cx" values="150; 250; 150" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="50; 150; 50" dur="14s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="200" r="120" fill="#ffb199" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cx" values="650; 550; 650" dur="15s" repeatCount="indefinite" />
    <animate attributeName="cy" values="200; 100; 200" dur="18s" repeatCount="indefinite" />
  </circle>

  <!-- Floating Hearts (SVG paths) -->
  <g class="heart h1" transform="translate(100, 150)"><path d="M 0,15 A 10,10 0,0,1 20,15 A 10,10 0,0,1 40,15 Q 40,30 20,45 Q 0,30 0,15 z" /></g>
  <g class="heart h2" transform="translate(680, 180)"><path d="M 0,15 A 10,10 0,0,1 20,15 A 10,10 0,0,1 40,15 Q 40,30 20,45 Q 0,30 0,15 z" /></g>
  <g class="heart h3" transform="translate(350, 200)"><path d="M 0,15 A 10,10 0,0,1 20,15 A 10,10 0,0,1 40,15 Q 40,30 20,45 Q 0,30 0,15 z" /></g>
  <g class="heart h4" transform="translate(600, 100)"><path d="M 0,15 A 10,10 0,0,1 20,15 A 10,10 0,0,1 40,15 Q 40,30 20,45 Q 0,30 0,15 z" /></g>
  <g class="heart h5" transform="translate(200, 120)"><path d="M 0,15 A 10,10 0,0,1 20,15 A 10,10 0,0,1 40,15 Q 40,30 20,45 Q 0,30 0,15 z" /></g>

  <!-- Typography -->
  <g class="text-container">
    <text x="400" y="115" class="title" text-anchor="middle">Interactive Birthday Surprise</text>
    <text x="400" y="165" class="subtitle" text-anchor="middle">A CINEMATIC &amp; ROMANTIC WEB EXPERIENCE</text>
  </g>
</svg>
